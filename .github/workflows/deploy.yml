name: CI/CD PortTrack

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPO: 123456789012.dkr.ecr.us-east-1.amazonaws.com/porttrack

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REPO

      - name: Build y push imagen Docker
        run: |
          docker build -t porttrack .
          docker tag porttrack:latest $ECR_REPO:latest
          docker push $ECR_REPO:latest

      - name: Escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REPO }}:latest

      - name: Despliegue a entorno Green con CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name PortTrackApp \
            --deployment-group-name BlueGreenGroup \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --s3-location bucket=my-porttrack-bucket,bundleType=zip,key=porttrack-deploy.zip
